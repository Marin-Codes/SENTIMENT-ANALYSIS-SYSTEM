name: S.A.R.A. CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-syntax-check:
    name: Code Quality & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Verify Python Syntax
        run: |
          python -m py_compile app.py auth_server.py config.py main.py

      - name: Lint with Flake8 (Syntax & Major Errors)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,__pycache__,end_to_end_sentiment_analysis-master

  docker-build-test:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: lint-and-syntax-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sara-sentiment-web:ci-test
