services:
  sara-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sara-sentiment-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    volumes:
      - sara-models-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sara-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sara-auth-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    command: ["python", "auth_server.py"]
    env_file:
      - path: .env
        required: false

volumes:
  sara-models-cache:
    name: sara_models_cache
